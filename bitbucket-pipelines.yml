 image: node:20

 pipelines:
   branches:
     default:
       - step:
           name: Instalar dependencias
           caches:
             - node
           script:
             - corepack enable
             - corepack prepare yarn@4.12.0 --activate
             - yarn --version
             - yarn install --immutable

