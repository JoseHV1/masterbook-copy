<div class="table-responsive" *ngIf="data">
  <table mat-table [dataSource]="data">

    <ng-container matColumnDef="serial">
      <th mat-header-cell *matHeaderCellDef>Serial</th>
      <td mat-cell *matCellDef="let row">
        <span
          class="light-blue-700"
          style="cursor: pointer"
          (click)="goToDetail.emit(row.serial)">
          #{{ row.serial }}
        </span>
      </td>
    </ng-container>

    <ng-container matColumnDef="agency">
      <th mat-header-cell *matHeaderCellDef>Agency</th>
      <td mat-cell *matCellDef="let row">{{ row.agency?.name ?? '—' }}</td>
    </ng-container>

    <ng-container matColumnDef="tenant">
      <th mat-header-cell *matHeaderCellDef>Region</th>
      <td mat-cell *matCellDef="let row">
        <span *ngIf="row.tenant" class="badge bg-secondary">{{ row.tenant.code }}</span>
        <span *ngIf="!row.tenant">—</span>
      </td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let row">
        <span class="billing-status billing-status--{{ row.status }}">{{ row.status }}</span>
      </td>
    </ng-container>

    <ng-container matColumnDef="event_type">
      <th mat-header-cell *matHeaderCellDef>Event</th>
      <td mat-cell *matCellDef="let row">
        <span style="font-size: 0.8rem; color: #555">{{ row.stripe_event_type | stripeEventLabel | translate }}</span>
      </td>
    </ng-container>

    <ng-container matColumnDef="amount">
      <th mat-header-cell *matHeaderCellDef>Amount</th>
      <td mat-cell *matCellDef="let row">{{ formatAmount(row.amount, row.currency) }}</td>
    </ng-container>

    <ng-container matColumnDef="paid_at">
      <th mat-header-cell *matHeaderCellDef>Date</th>
      <td mat-cell *matCellDef="let row">
        {{ (row.paid_at ?? row.createdAt) | date: 'mediumDate' }}
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns" class="mas-table-row"></tr>
    <tr *matNoDataRow>
      <td [colSpan]="displayedColumns.length">
        <app-default-empty-state *ngIf="!filtersActive.length"></app-default-empty-state>
        <app-filter-empty-state *ngIf="filtersActive.length"></app-filter-empty-state>
      </td>
    </tr>

  </table>
</div>
