<ng-template #table>
  <app-pages-layout>
    <ng-container content>

      <app-filtered-table-header
        [filtersActive]="filtersActive"
        (search)="onQueryFilter($event)"
        (openFilters)="drawer.toggle()"
        (removeChip)="removeFilterFromChip($event)">
      </app-filtered-table-header>

      <div class="table-responsive">
        <table mat-table [dataSource]="data.records">

          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>{{ 'PORTAL.PORTAL_ADMIN.POLICY_SETTINGS.TABLE_NAME' | translate }}</th>
            <td mat-cell *matCellDef="let element">{{ element.name | notNull }}</td>
          </ng-container>

          <ng-container matColumnDef="created_at">
            <th mat-header-cell *matHeaderCellDef>{{ 'PORTAL.PORTAL_ADMIN.POLICY_SETTINGS.CREATED_ON' | translate }}</th>
            <td mat-cell *matCellDef="let element">{{ element.createdAt | date }}</td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr *matNoDataRow>
            <td [attr.colspan]="displayedColumns.length">
              <app-default-empty-state *ngIf="!filtersActive.length"></app-default-empty-state>
              <app-filter-empty-state *ngIf="filtersActive.length"></app-filter-empty-state>
            </td>
          </tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns" class="mas-table-row"></tr>

        </table>
      </div>

      <mat-paginator
        [pageSizeOptions]="[10, 25, 50]"
        [length]="data.total_records"
        [pageIndex]="data.page - 1"
        [pageSize]="data.limit"
        (page)="changePaginator($event)"
        showFirstLastButtons>
      </mat-paginator>

    </ng-container>
  </app-pages-layout>
</ng-template>

<ng-template #filters>
  <app-filter-wrapper
    [config]="filterConfig"
    (closeFilters)="drawer.toggle()"
    (activeFilterChange)="handleApplyFilter($event); drawer.toggle()">
  </app-filter-wrapper>
</ng-template>

<mat-drawer-container [hasBackdrop]="false">
  <mat-drawer #drawer [mode]="'over'" [position]="'end'">
    <ng-container *ngTemplateOutlet="filters"></ng-container>
  </mat-drawer>
  <mat-drawer-content>
    <ng-container *ngTemplateOutlet="table"></ng-container>
  </mat-drawer-content>
</mat-drawer-container>
