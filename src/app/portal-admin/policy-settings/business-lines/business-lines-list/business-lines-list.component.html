<ng-template #table>
  <app-pages-layout
    [button]="{ text: ('PORTAL.PORTAL_ADMIN.POLICY_SETTINGS.BTN_NEW_BUSINESS_LINE' | translate), icon: 'add' }"
    (btnClick)="goToNew()">
    <ng-container content>

      <app-filtered-table-header
        [filtersActive]="filtersActive"
        (search)="onQueryFilter($event)"
        (openFilters)="drawer.toggle()"
        (removeChip)="removeFilterFromChip($event)">
      </app-filtered-table-header>

      <app-business-lines-admin-table
        [data]="data.records"
        [filtersActive]="filtersActive"
        (deleteBusinessLine)="confirmDelete($event)"
        (tenantStatus)="openTenantStatusModal($event)">
      </app-business-lines-admin-table>

      <mat-paginator
        [pageSizeOptions]="[10, 25, 50]"
        [length]="data.total_records"
        [pageIndex]="data.page - 1"
        [pageSize]="data.limit"
        (page)="changePaginator($event)"
        showFirstLastButtons>
      </mat-paginator>

    </ng-container>
  </app-pages-layout>
</ng-template>

<ng-template #filters>
  <app-filter-wrapper
    [config]="filterConfig"
    (closeFilters)="drawer.toggle()"
    (activeFilterChange)="handleApplyFilter($event); drawer.toggle()">
  </app-filter-wrapper>
</ng-template>

<mat-drawer-container [hasBackdrop]="false">
  <mat-drawer #drawer [mode]="'over'" [position]="'end'">
    <ng-container *ngTemplateOutlet="filters"></ng-container>
  </mat-drawer>
  <mat-drawer-content>
    <ng-container *ngTemplateOutlet="table"></ng-container>
  </mat-drawer-content>
</mat-drawer-container>
