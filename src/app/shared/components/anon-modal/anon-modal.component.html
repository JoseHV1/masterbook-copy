<p-dialog
  [(visible)]="visible"
  [modal]="true"
  [style]="{
    width: '95%',
    maxWidth: width + 'rem',
    maxHeight: (height ? height + 'rem' : '90vh')
  }"
  [draggable]="false"
  [closable]="true"
  [dismissableMask]="true"
  (onHide)="visibleChange.emit(false)"
  [ngClass]="{ 'hide-close': hideClose }"
  [resizable]="false">
  <ng-content select="[content]"> </ng-content>
</p-dialog>
