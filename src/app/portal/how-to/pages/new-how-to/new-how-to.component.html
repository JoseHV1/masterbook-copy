<app-pages-layout>
  <ng-container content>
    <div class="d-flex align-items-center">
      <div class="px-2">
        <span
          class="material-icons-outlined me-2"
          style="cursor: pointer"
          [matTooltip]="'PORTAL.COMMON.BACK_TO_LAST_PAGE' | translate"
          (click)="goBack()">
          arrow_back
        </span>
      </div>
    </div>

    <div class="col-12 mb-4">
      <div class="text-center">
        <h1 class="subtitle-1 dark-blue-400">{{ 'PORTAL.HOW_TO.CREATE_VIDEO' | translate }}</h1>
      </div>
    </div>

    <div class="px-2 px-lg-5">
      <app-form-new-how-to></app-form-new-how-to>
    </div>
  </ng-container>
</app-pages-layout>
