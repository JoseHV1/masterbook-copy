<app-pages-layout>
  <ng-container content>
    <div class="d-flex justify-content-between align-items-center mb-1 ms-2">
      <span class="material-icons-outlined me-2" style="cursor: pointer"
        (click)="goBack()">arrow_back</span
      >
    </div>
    <div
      class="d-flex flex-column-reverse flex-md-row gap-1 py-4"
      *ngIf="data.records">
      <mat-action-list class="col-md-4 px-1 how-to-list">
        <p>{{ 'PORTAL.HOW_TO.GRID.TITLE' | translate }}</p>
        <app-input
          [(ngModel)]="query"
          [placeholder]="'PORTAL.HOW_TO.GRID.PLACEHOLDER_SEARCH' | translate"
          (ngModelChange)="filterHowTo()"></app-input>
        <button
          mat-list-item
          *ngFor="let video of filterdResults; let i = index"
          (click)="selectVideo(video); selectedIndex = i"
          [class.item-active]="selectedIndex === i"
          class="list-item-color my-1">
          <span class="list-item-text-color">{{ video.title }}</span>
        </button>
      </mat-action-list>
      <div
        *ngIf="selectedVideo && safeUrlVideo; else noDataRecords"
        class="col-md-8">
        <div class="video-wrapper" [class.short-mode]="isShort">
          <iframe
            class="video-iframe"
            [src]="safeUrlVideo"
            frameborder="0"></iframe>
        </div>
        <div [innerHTML]="selectedVideo.description"></div>
      </div>
    </div>

    <ng-template #noDataRecords>
      <div class="col-12 col-md-12 col-sm-12 text-center">
        <img
          src="assets/images/empty/default-empty.svg"
          class="col-12 col-md-4"
          alt="" />
        <p class="subtitle-1 dark-blue-500">
          {{ 'PORTAL.HOW_TO.GRID.EMPTY_TITLE' | translate }}
        </p>
        <p class="text-3 black">
          {{ 'PORTAL.HOW_TO.GRID.EMPTY_TEXT' | translate }}
        </p>
      </div>
    </ng-template>
  </ng-container>
</app-pages-layout>
