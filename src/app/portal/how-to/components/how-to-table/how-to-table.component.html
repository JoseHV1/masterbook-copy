<div class="table-responsive" *ngIf="data">
  <table mat-table [dataSource]="data" cdkDropList (cdkDropListDropped)="onDrop($event)" style="width: auto; overflow-x: auto">
    <ng-container matColumnDef="drag">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let element">
        <span class="material-icons-outlined drag-handle drag-cursor" cdkDragHandle>drag_indicator</span>
      </td>
    </ng-container>

    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef>{{ 'PORTAL.HOW_TO.TABLE.ID' | translate }}</th>
      <td mat-cell *matCellDef="let element">
        <span
          *ngIf="element.serial; else notId"
          (click)="_url.navigateTo('portal-admin/how-to', element.serial)"
          class="light-blue-700"
          [matTooltip]="'PORTAL.HOW_TO.TABLE.TOOLTIP_GO_DETAIL' | translate"
          style="cursor: pointer"
          data-testid="how-to-serial"
          matTooltipPosition="above">
          #{{ element.serial | notNull }}
        </span>
        <ng-template #notId>---</ng-template>
      </td>
    </ng-container>

    <ng-container matColumnDef="title">
      <th mat-header-cell *matHeaderCellDef>{{ 'PORTAL.HOW_TO.TABLE.TITLE' | translate }}</th>
      <td mat-cell *matCellDef="let element">
        {{ element.title | notNull }}
      </td>
    </ng-container>

    <ng-container matColumnDef="created_at">
      <th mat-header-cell *matHeaderCellDef>{{ 'PORTAL.HOW_TO.TABLE.CREATED_ON' | translate }}</th>
      <td mat-cell *matCellDef="let element">
        {{ element.createdAt | date }}
      </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>{{ 'PORTAL.COMMON.ACTIONS' | translate }}</th>
      <td mat-cell *matCellDef="let element">
        <button mat-icon-button [matMenuTriggerFor]="menu">
          <mat-icon class="dark-blue-400">more_vert</mat-icon>
        </button>

        <mat-menu #menu="matMenu" xPosition="before">
          <button
            mat-menu-item
            (click)="_url.navigateTo('portal-admin/how-to', element.serial, 'edit')">
            <span class="d-flex align-items-center gap-2">
              <span class="material-icons-outlined dark-blue-400">edit</span>
              {{ 'PORTAL.COMMON.EDIT' | translate }}
            </span>
          </button>

          <button
            mat-menu-item
            *ngIf="element.tenants?.length"
            (click)="openTenantStatusModal(element)">
            <span class="d-flex align-items-center gap-2">
              <span class="material-icons-outlined dark-blue-400">tune</span>
              {{ 'PORTAL.HOW_TO.TOOLTIP_TENANT_STATUS' | translate }}
            </span>
          </button>

          <button mat-menu-item (click)="deleteHowTo(element)">
            <span class="d-flex align-items-center gap-2">
              <span class="material-icons-outlined text-danger">delete</span>
              {{ 'PORTAL.COMMON.DELETE' | translate }}
            </span>
          </button>
        </mat-menu>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

    <tr *matNoDataRow>
      <td [attr.colspan]="displayedColumns.length">
        <app-default-empty-state
          [url]="'portal-admin/how-to/new'"
          *ngIf="!filtersActive.length"></app-default-empty-state>
        <app-filter-empty-state
          *ngIf="filtersActive.length"></app-filter-empty-state>
      </td>
    </tr>

    <tr
      mat-row
      *matRowDef="let row; columns: displayedColumns"
      cdkDrag
      [cdkDragData]="row"
      class="mas-table-row drag-cursor"
      data-testid="how-to-row"
      [attr.data-how-to-id]="row._id"
      [attr.data-how-to-serial]="row.serial"></tr>
  </table>
</div>
