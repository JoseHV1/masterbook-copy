<div [formGroup]="form" *ngIf="dataAgency" class="bg-gray-200 px-3 px-lg-4 py-4 py-lg-5">
  <div class="row">
    <!-- Left -->
    <div class="col-lg-3 col-md-12 d-flex align-items-center justify-content-center flex-column mb-4 mb-lg-0">
      <div class="d-flex align-items-center justify-content-center flex-column">
        <app-picture-selector [icon]="logo" (imgChange)="
            addImage($event, 'logo_image')
          "></app-picture-selector>
      </div>

      <div class="mt-3 mb-md-4 d-flex anon-checkbox">
        <p-checkbox formControlName="check_brand_publication" value="check_brand_publication"
          id="check_brand_publication"></p-checkbox>
        <label class="ms-2 d-flex align-items-center text-check" for="check_brand_publication">
          Do you want to brand your MasterBook with your logo?
          <img class="ms-2 me-2 me-md-0" src="/assets/icons/register-two/information.svg"
            pTooltip="Informacion por definir" tooltipPosition="top" />
        </label>
      </div>
    </div>

    <!-- Right -->
    <div class="col-lg-8 ms-lg-5 col-md-12 pe-0 pe-lg-3">
      <h4 class="mt-4 mb-4 mb-md-5 profile__subtitle text-center">
        Agency Settings
      </h4>

      <div class="row">
        <!-- First Column -->
        <div class="col-lg-6">
          <div class="col-12 mb-4 mb-md-0">
            <label>Percentaje Retentions</label>
            <app-input formControlName="retentions" placeholder="% 0" type="tel" [inputMask]="'separator'"
              [maskPrefix]="'% '"></app-input>
          </div>
        </div>

        <!-- Second Column -->
        <div class="col-lg-6">
          <div class="col-12 mb-4 mb-md-0">
            <label>Percentaje Taxes</label>
            <app-input formControlName="taxes" placeholder="% 0" type="tel" [inputMask]="'separator'"
              [maskPrefix]="'% '"></app-input>
          </div>
        </div>

        <div class="col-lg-6">
          <div class="col-12 mb-4 mb-md-0">
            <label>Business Lines</label>
            <div class="mb-3">
              <div class="p-inputgroup anon-input-custom anon-multiselect-custom" [ngClass]="{
                  'custom-error': isInvalid(form.controls['business_lines_ids'])
                }">
                <span class="p-inputgroup-addon">
                  <img src="/assets/icons/register-two/business-line.svg" alt="" />
                </span>
                <p-multiSelect [options]="businessLines" formControlName="business_lines_ids" optionValue="_id"
                  defaultLabel="Bussines Line" optionLabel="name" display="chip"></p-multiSelect>
              </div>
              <!-- <small *ngIf="hasError(form.controls['business_lines_ids'], 'required')" class="text-danger mt-1">
                This field is required
              </small> -->
              <small *ngIf="hasError(form.controls['business_lines_ids'], 'validlength')" class="text-danger mt-1">
                Must select between 1 and 6 lines of business
              </small>
            </div>
          </div>
        </div>

        <div class="d-flex justify-content-center align-items-center mt-3 mt-md-5">
          <button class="primary-button big-button back-light-blue-400 white mx-1" (click)="send()">
            Edit Settings
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
