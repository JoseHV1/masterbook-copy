<ng-container
  *ngIf="
    isAgent &&
      quote.status === QuoteStatusEnum.ACCEPTED &&
      request.status !== RequestStatusEnum.CLOSED;
    else defaultTemplate
  ">
  <div
    class="selected-quote-button white m-2 d-flex"
    data-testid="quote-selected">
    <div
      class="selection-side"
      (click)="toggleStatus()"
      data-testid="quote-toggle-status">
      Selected
    </div>

    <div
      class="policy-side"
      [matMenuTriggerFor]="menu"
      data-testid="quote-actions">
      <span
        class="material-icons-outlined white p-0"
        style="cursor: pointer"
        matTooltip="Options">
        arrow_drop_down
      </span>
    </div>
  </div>

  <mat-menu #menu="matMenu">
    <button
      mat-menu-item
      (click)="goToPolicy()"
      data-testid="quote-create-policy">
      Create policy
    </button>
  </mat-menu>
</ng-container>

<ng-template #defaultTemplate>
  <button
    class="primary-button big-button back-dark-blue-400 white m-2"
    *ngIf="quote.status !== QuoteStatusEnum.ACCEPTED"
    (click)="toggleStatus()"
    data-testid="quote-choose"
    [disabled]="
      [RequestStatusEnum.QUOTE_SELECTED, RequestStatusEnum.CLOSED].includes(
        request.status
      )
    ">
    Choose
  </button>

  <button
    class="primary-button big-button back-dark-blue-400 white m-2"
    *ngIf="quote.status === QuoteStatusEnum.ACCEPTED"
    (click)="toggleStatus()"
    data-testid="quote-selected-button"
    [disabled]="[RequestStatusEnum.CLOSED].includes(request.status)">
    Selected
  </button>
</ng-template>
