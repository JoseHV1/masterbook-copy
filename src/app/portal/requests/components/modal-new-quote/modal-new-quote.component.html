<h2
  mat-dialog-title
  class="d-flex justify-content-between align-items-start pt-1 pb-1 pt-md-3 pb-md-2">
  <button mat-icon-button mat-dialog-close aria-label="Cerrar">
    <mat-icon>close</mat-icon>
  </button>
</h2>

<mat-dialog-content class="px-4 py-2 px-md-5 pb-md-4 mb-3">
  <form [formGroup]="form" *ngIf="form">
    <div class="row">
      <h6 class="title-form text-center mb-3 mb-md-4">New Quote</h6>
      <div class="col-12 col-md-6 mb-3 mb-md-4">
        <label>Insurer *</label>
        <app-insurance-company-selector
          [placeholder]="'Select a company'"
          formControlName="insurer_id"></app-insurance-company-selector>
      </div>

      <div class="col-12 col-md-6 mb-3 mb-md-4">
        <label>Date of quotes *</label>
        <app-date-field
          [placeholder]="'Select a date'"
          formControlName="quote_date"></app-date-field>
      </div>

      <div class="col-12 col-md-6 mb-3 mb-md-4">
        <label>Premium amount *</label>
        <app-input
          placeholder="$ 0.00"
          type="tel"
          [inputMask]="'separator.2'"
          [maskPrefix]="'$ '"
          formControlName="prime_amount"></app-input>
      </div>

      <div class="col-12 col-md-6 mb-3 mb-md-4">
        <label>Coverage *</label>
        <app-input
          placeholder="$ 0.00"
          type="tel"
          [inputMask]="'separator.2'"
          [maskPrefix]="'$ '"
          formControlName="coverage"></app-input>
      </div>

      <div class="col-12 col-md-6 mb-3 mb-md-4">
        <label>Deductible *</label>
        <app-input
          placeholder="$ 0.00"
          type="tel"
          [inputMask]="'separator.2'"
          [maskPrefix]="'$ '"
          formControlName="deductible"></app-input>
      </div>

      <div class="col-12 col-md-6 mb-3 mb-md-4">
        <label>Quote copy *</label>
        <app-file-picker
          placeholder="Attach quote copy"
          formControlName="document"
          data-testid="policy-upload-input">
        </app-file-picker>
      </div>
    </div>

    <div class="d-flex align-items-center justify-content-center gap-2">
      <button
        class="big-button primary-button white back-gray-400 mx-1"
        (click)="close(false)">
        Close
      </button>

      <button
        class="primary-button big-button back-light-blue-400 white mx-1 mt-2"
        (click)="createQuote()"
        [disabled]="form.invalid">
        Save
      </button>
    </div>
  </form>
</mat-dialog-content>
