<app-pages-layout>
  <ng-container content>
    <div class="not-paid-info py-2 px-3 mb-4" style="font-size: 14px">
      {{ 'PORTAL.NEW_PAYMENT.NOT_PAID_INFO' | translate }}
    </div>

    <div class="d-flex align-items-center">
      <div class="px-2">
        <span
          class="material-icons-outlined me-2"
          style="cursor: pointer"
          [matTooltip]="'PORTAL.COMMON.BACK_TO_LAST_PAGE' | translate"
          (click)="goBack()">
          arrow_back
        </span>
      </div>
    </div>

    <div class="col-12 mb-4">
      <div class="text-center">
        <h3 class="subtitle-1 dark-blue-400">{{ 'PORTAL.NEW_PAYMENT.TITLE' | translate }}</h3>
      </div>
    </div>

    <div class="px-2 px-lg-5">
      <app-form-payments [payment]="payment"></app-form-payments>
    </div>
  </ng-container>
</app-pages-layout>
