<div class="mb-4" data-testid="policy-form">
  <form [formGroup]="form" *ngIf="form" class="row my-5">
    <div class="col-12 col-md-4 mb-3 mb-md-4">
      <label>{{ 'PORTAL.POLICIES.FORM_POLICY_NUMBER' | translate }}</label>
      <app-input [placeholder]="'PORTAL.POLICIES.FORM_POLICY_NUMBER' | translate" type="text" formControlName="policy_number" data-testid="policy-number"></app-input>
    </div>

    <div class="col-12 col-md-4 mb-3 mb-md-4">
      <label>{{ 'PORTAL.POLICIES.FORM_EFFECTIVE' | translate }}</label>
      <app-date-input data-testid="policy-start-date" (ngModelChange)="form.get('end_date')?.setValue(null)" formControlName="start_date"></app-date-input>
    </div>

    <div class="col-12 col-md-4 mb-3 mb-md-4">
      <label>{{ 'PORTAL.POLICIES.FORM_EXPIRATION' | translate }}</label>
      <app-date-input data-testid="policy-end-date" [min]="minExpirationDate" formControlName="end_date"></app-date-input>
    </div>

    <div class="col-12 col-md-4 mb-3 mb-md-4">
      <label>{{ 'PORTAL.POLICIES.FORM_INSURER' | translate }}</label>
      <app-dropdown-field [placeholder]="'PORTAL.POLICIES.INSURER' | translate" formControlName="insurer_id" data-testid="policy-insurer" [options]="insuranceCompanyOptions"></app-dropdown-field>
    </div>

    <div class="col-12 col-md-4 mb-3 mb-md-4">
      <label>{{ 'PORTAL.POLICIES.FORM_PREMIUM' | translate }}</label>
      <app-currency-input formControlName="prime_amount" data-testid="policy-premium"></app-currency-input>
    </div>

    <div class="col-12 col-md-4 mb-3 mb-md-4">
      <label>{{ 'PORTAL.POLICIES.FORM_COVERAGE' | translate }}</label>
      <app-currency-input formControlName="coverage" data-testid="policy-coverage"></app-currency-input>
      <small
        *ngIf="hasError(form.get('coverage'), 'coverageLessThanPrime')"
        class="text-danger d-block mt-1"
        data-testid="policy-coverage-error">
        {{ 'PORTAL.POLICIES.ERROR_COVERAGE_MIN' | translate }}
      </small>
    </div>

    <div class="col-12 col-md-4 mb-3 mb-md-4">
      <label>{{ 'PORTAL.POLICIES.FORM_DEDUCTIBLE' | translate }}</label>
      <app-currency-input formControlName="deductible" data-testid="policy-deductible"></app-currency-input>
    </div>

    <div class="col-12 col-md-4 mb-3 mb-md-4">
      <label>{{ 'PORTAL.POLICIES.FORM_OBJECT' | translate }}</label>
      <app-input [placeholder]="'PORTAL.POLICIES.OBJECT' | translate" type="text" data-testid="policy-insure-object" formControlName="insure_object"></app-input>
    </div>

    <div class="col-12 col-md-4 mb-3 mb-md-4" data-testid="policy-upload">
      <label>{{ 'PORTAL.POLICIES.FORM_ATTACH_COPY' | translate }}</label>
      <app-file-picker [placeholder]="'PORTAL.POLICIES.FORM_ATTACH_COPY' | translate" formControlName="document" data-testid="policy-upload-input"></app-file-picker>
    </div>

    <div class="col-12 col-md-4 mb-3 mb-md-4" *ngIf="showAgentSelector">
      <label>{{ 'PORTAL.POLICIES.FORM_AGENT' | translate }}</label>
      <app-agent-selector [placeholder]="'PORTAL.POLICIES.FORM_AGENT' | translate" data-testid="policy-agent" formControlName="agent_id"></app-agent-selector>
    </div>

    <h4 class="subtitle-3 dark-blue-400 my-md-4 my-3">{{ 'PORTAL.POLICIES.FORM_FORMS' | translate }}</h4>

    <div class="col-12 mt-2">
      <app-multi-file-upload data-testid="policy-request-documents" formControlName="request_documents"></app-multi-file-upload>
    </div>

    <div class="my-3 my-md-4">
      <label class="d-block">{{ 'PORTAL.POLICIES.FORM_COVERAGE_DETAILS' | translate }}</label>
      <textarea
        rows="5"
        cols="30"
        formControlName="description"
        data-testid="policy-description"
        class="w-100 py-1 px-2"
        [ngClass]="{ 'textarea-invalid': isInvalid(form.controls['description']) }">
      </textarea>
      <small *ngIf="hasError(form.controls['description'], 'required')" class="text-danger mt-1">
        {{ 'PORTAL.COMMON.REQUIRED' | translate }}
      </small>
      <small *ngIf="hasError(form.controls['description'], 'minlength')" class="text-danger mt-1">
        {{ 'PORTAL.POLICIES.ERROR_DESCRIPTION_MIN' | translate }}
      </small>
    </div>

    <div class="d-flex justify-content-center" style="gap: 10px !important">
      <button class="primary-button big-button back-gray-500 white" (click)="goBack()">
        {{ 'PORTAL.COMMON.BACK' | translate }}
      </button>
      <button class="primary-button big-button back-light-blue-500 white" data-testid="policy-save" (click)="openConfirmationModal()" [disabled]="form.invalid">
        {{ 'PORTAL.COMMON.SAVE_CHANGES' | translate }}
      </button>
    </div>
  </form>
</div>
