<form [formGroup]="form" data-testid="lead-form">
  <div class="row mb-4">
    <div class="col-12 col-md-6 mb-4 mb-md-0">
      <label>First name*</label>
      <app-input
        [dataTestId]="'lead-first-name'"
        placeholder="Enter First Name"
        type="text"
        formControlName="first_name"
        autocomplete="given-name"></app-input>
    </div>

    <div class="col-12 col-md-6 mb-4 mb-md-0">
      <label>Last name*</label>
      <app-input
        [dataTestId]="'lead-last-name'"
        placeholder="Enter Last Name"
        type="text"
        formControlName="last_name"
        autocomplete="family-name"></app-input>
    </div>

    <div class="col-12 col-md-6 mb-4 mb-md-0">
      <label>Email*</label>
      <app-input
        [dataTestId]="'lead-email'"
        placeholder="Enter Email Address"
        type="email"
        formControlName="email"
        autocomplete="email"></app-input>
    </div>

    <div class="col-12 col-md-6 mb-4 mb-md-0">
      <label>Confirm email*</label>
      <app-input
        [dataTestId]="'lead-email-confirm'"
        placeholder="Confirm Email Address"
        type="email"
        formControlName="email_confirmation"
        autocomplete="email"></app-input>
    </div>

    <div class="col-12 col-md-6 mb-4 mb-md-0">
      <label>Phone number*</label>
      <app-input
        [dataTestId]="'lead-phone'"
        placeholder="(XXX) XXX-XXXX"
        type="tel"
        [inputMask]="'(000) 000-0000'"
        formControlName="phone_number"
        autocomplete="tel"></app-input>
    </div>

    <div class="col-12 col-md-6 mb-4 mb-md-0">
      <label>Gender*</label>
      <app-dropdown-field
        [dataTestId]="'lead-gender-trigger'"
        data-testid="lead-gender"
        [placeholder]="'Select a gender'"
        formControlName="gender"
        [options]="dropDownGender"
        autocomplete="sex"></app-dropdown-field>
    </div>

    <div class="col-8 mb-4 mb-md-0">
      <label>Address*</label>
      <app-address-input
        [dataTestId]="'lead-address-input'"
        placeholder="Enter address"
        formControlName="address"></app-address-input>
    </div>

    <div class="col-4 mb-4 mb-md-0">
      <label>Zip code*</label>
      <app-input
        [dataTestId]="'lead-zip'"
        placeholder="XXXXX"
        type="tel"
        [inputMask]="'99999'"
        formControlName="zipcode"
        autocomplete="postal-code" />
    </div>

    <div class="col-12 mb-4 mb-md-0">
      <label>Areas of interest*</label>
      <div class="mb-3">
        <div class="p-inputgroup anon-input-custom anon-multiselect-custom">
          <p-multiSelect
            [options]="areasOfInterestOptions"
            formControlName="areas_of_interest"
            optionValue="code"
            defaultLabel="Select areas of interest"
            optionLabel="name"
            display="chip"></p-multiSelect>
        </div>
      </div>
    </div>

    <div class="col-12 mb-4 mb-md-0">
      <label>How did you hear about us?*</label>
      <app-dropdown-field
        [dataTestId]="'lead-capture-medium-trigger'"
        [placeholder]="'Select an option'"
        formControlName="capture_medium"
        [options]="dropDownCaptureMedium"></app-dropdown-field>
    </div>

    <div class="col-12 mb-4 mb-md-0" *ngIf="isOtherCaptureMedium">
      <label>Please describe*</label>
      <app-input
        [dataTestId]="'lead-other-capture-medium'"
        placeholder="Describe how you heard about us"
        type="text"
        formControlName="other_capture_medium"></app-input>
    </div>

    <div class="col-12 mb-4 mb-md-0">
      <label>Description</label>
      <textarea
        rows="5"
        cols="30"
        formControlName="notes"
        placeholder="Add any additional notes or details..."
        class="w-100 py-1 px-2"
        [ngClass]="{ 'textarea-invalid': form.controls['notes'].invalid && form.controls['notes'].touched }">
      </textarea>
      <small
        *ngIf="form.controls['notes'].hasError('maxlength') && form.controls['notes'].touched"
        class="text-danger mt-1">
        Description cannot exceed 500 characters
      </small>
    </div>
  </div>

  <div class="d-flex align-items-center justify-content-center">
    <button
      data-testid="lead-cancel"
      class="primary-button big-button back-gray-400 white mx-1"
      (click)="cancelForm()">
      Cancel
    </button>

    <button
      data-testid="lead-save"
      class="primary-button big-button back-light-blue-400 white mx-1"
      [disabled]="form.invalid"
      (click)="openConfirmationModal()">
      Submit
    </button>
  </div>

  <p class="powered-by">
    Powered by <span>MyMasterBook</span>
  </p>
</form>
