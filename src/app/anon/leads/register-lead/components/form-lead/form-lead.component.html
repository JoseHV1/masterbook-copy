<form [formGroup]="form" data-testid="lead-form">
  <div class="row mb-4">
    <div class="col-12 col-md-6 mb-4 mb-md-0">
      <label>{{ 'LEAD_FORM.FIELD_FIRST_NAME' | translate }}</label>
      <app-input
        [dataTestId]="'lead-first-name'"
        [placeholder]="'LEAD_FORM.PLACEHOLDER_FIRST_NAME' | translate"
        type="text"
        formControlName="first_name"
        autocomplete="given-name"></app-input>
    </div>

    <div class="col-12 col-md-6 mb-4 mb-md-0">
      <label>{{ 'LEAD_FORM.FIELD_LAST_NAME' | translate }}</label>
      <app-input
        [dataTestId]="'lead-last-name'"
        [placeholder]="'LEAD_FORM.PLACEHOLDER_LAST_NAME' | translate"
        type="text"
        formControlName="last_name"
        autocomplete="family-name"></app-input>
    </div>

    <div class="col-12 col-md-6 mb-4 mb-md-0">
      <label>{{ 'LEAD_FORM.FIELD_EMAIL' | translate }}</label>
      <app-input
        [dataTestId]="'lead-email'"
        [placeholder]="'LEAD_FORM.PLACEHOLDER_EMAIL' | translate"
        type="email"
        formControlName="email"
        autocomplete="email"></app-input>
    </div>

    <div class="col-12 col-md-6 mb-4 mb-md-0">
      <label>{{ 'LEAD_FORM.FIELD_EMAIL_CONFIRM' | translate }}</label>
      <app-input
        [dataTestId]="'lead-email-confirm'"
        [placeholder]="'LEAD_FORM.PLACEHOLDER_EMAIL_CONFIRM' | translate"
        type="email"
        formControlName="email_confirmation"
        autocomplete="email"></app-input>
    </div>

    <div class="col-12 col-md-6 mb-4 mb-md-0">
      <label>{{ 'LEAD_FORM.FIELD_PHONE' | translate }}</label>
      <app-input
        [dataTestId]="'lead-phone'"
        placeholder="(XXX) XXX-XXXX"
        type="tel"
        [inputMask]="'(000) 000-0000'"
        formControlName="phone_number"
        autocomplete="tel"></app-input>
    </div>

    <div class="col-12 col-md-6 mb-4 mb-md-0">
      <label>{{ 'LEAD_FORM.FIELD_GENDER' | translate }}</label>
      <app-dropdown-field
        [dataTestId]="'lead-gender-trigger'"
        data-testid="lead-gender"
        [placeholder]="'LEAD_FORM.PLACEHOLDER_GENDER' | translate"
        formControlName="gender"
        [options]="dropDownGender"
        autocomplete="sex"></app-dropdown-field>
    </div>

    <div class="col-8 mb-4 mb-md-0">
      <label>{{ 'LEAD_FORM.FIELD_ADDRESS' | translate }}</label>
      <app-address-input
        [dataTestId]="'lead-address-input'"
        [placeholder]="'LEAD_FORM.PLACEHOLDER_ADDRESS' | translate"
        formControlName="address"></app-address-input>
    </div>

    <div class="col-4 mb-4 mb-md-0">
      <label>{{ 'LEAD_FORM.FIELD_ZIPCODE' | translate }}</label>
      <app-input
        [dataTestId]="'lead-zip'"
        placeholder="XXXXX"
        type="tel"
        [inputMask]="'99999'"
        formControlName="zipcode"
        autocomplete="postal-code" />
    </div>

    <div class="col-12 mb-4 mb-md-0">
      <label>{{ 'LEAD_FORM.FIELD_AREAS_INTEREST' | translate }}</label>
      <div class="mb-3">
        <div class="p-inputgroup anon-input-custom anon-multiselect-custom">
          <p-multiSelect
            [options]="areasOfInterestOptions"
            formControlName="areas_of_interest"
            optionValue="code"
            [defaultLabel]="'LEAD_FORM.PLACEHOLDER_AREAS_INTEREST' | translate"
            optionLabel="name"
            display="chip"></p-multiSelect>
        </div>
      </div>
    </div>

    <div class="col-12 mb-4 mb-md-0">
      <label>{{ 'LEAD_FORM.FIELD_HEAR_ABOUT_US' | translate }}</label>
      <app-dropdown-field
        [dataTestId]="'lead-capture-medium-trigger'"
        [placeholder]="'LEAD_FORM.PLACEHOLDER_SELECT_OPTION' | translate"
        formControlName="capture_medium"
        [options]="dropDownCaptureMedium"></app-dropdown-field>
    </div>

    <div class="col-12 mb-4 mb-md-0" *ngIf="isOtherCaptureMedium">
      <label>{{ 'LEAD_FORM.FIELD_DESCRIBE' | translate }}</label>
      <app-input
        [dataTestId]="'lead-other-capture-medium'"
        [placeholder]="'LEAD_FORM.PLACEHOLDER_DESCRIBE' | translate"
        type="text"
        formControlName="other_capture_medium"></app-input>
    </div>

    <div class="col-12 mb-4 mb-md-0">
      <label>{{ 'LEAD_FORM.FIELD_DESCRIPTION' | translate }}</label>
      <textarea
        rows="5"
        cols="30"
        formControlName="notes"
        [placeholder]="'LEAD_FORM.PLACEHOLDER_NOTES' | translate"
        class="w-100 py-1 px-2"
        [ngClass]="{ 'textarea-invalid': form.controls['notes'].invalid && form.controls['notes'].touched }">
      </textarea>
      <small
        *ngIf="form.controls['notes'].hasError('maxlength') && form.controls['notes'].touched"
        class="text-danger mt-1">
        {{ 'LEAD_FORM.ERROR_NOTES_MAXLENGTH' | translate }}
      </small>
    </div>
  </div>

  <div class="d-flex align-items-center justify-content-center">
    <button
      data-testid="lead-cancel"
      class="primary-button big-button back-gray-400 white mx-1"
      (click)="cancelForm()">
      {{ 'LEAD_FORM.BTN_CANCEL' | translate }}
    </button>

    <button
      data-testid="lead-save"
      class="primary-button big-button back-light-blue-400 white mx-1"
      [disabled]="form.invalid"
      (click)="openConfirmationModal()">
      {{ 'LEAD_FORM.BTN_SUBMIT' | translate }}
    </button>
  </div>

  <p class="powered-by">
    {{ 'LEAD_FORM.POWERED_BY' | translate }} <span>MyMasterBook</span>
  </p>
</form>
