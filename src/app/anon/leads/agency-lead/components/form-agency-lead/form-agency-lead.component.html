<form [formGroup]="form">
  <div class="row mb-4">

    <div class="col-12 col-md-6 mb-4 mb-md-0">
      <label>{{ 'LEAD_FORM.FIELD_FIRST_NAME' | translate }}</label>
      <app-input
        [placeholder]="'LEAD_FORM.PLACEHOLDER_FIRST_NAME' | translate"
        type="text"
        formControlName="first_name"
        autocomplete="given-name">
      </app-input>
    </div>

    <div class="col-12 col-md-6 mb-4 mb-md-0">
      <label>{{ 'LEAD_FORM.FIELD_LAST_NAME' | translate }}</label>
      <app-input
        [placeholder]="'LEAD_FORM.PLACEHOLDER_LAST_NAME' | translate"
        type="text"
        formControlName="last_name"
        autocomplete="family-name">
      </app-input>
    </div>

    <div class="col-12 mb-4 mb-md-0">
      <label>{{ 'LEAD_FORM.FIELD_EMAIL' | translate }}</label>
      <app-input
        [placeholder]="'LEAD_FORM.PLACEHOLDER_EMAIL' | translate"
        type="email"
        formControlName="email"
        autocomplete="email">
      </app-input>
    </div>

    <div class="col-12 mb-4 mb-md-0">
      <label>{{ 'LEAD_FORM.FIELD_HEAR_ABOUT_US' | translate }}</label>
      <app-dropdown-field
        [placeholder]="'LEAD_FORM.PLACEHOLDER_SELECT_OPTION' | translate"
        formControlName="capture_medium"
        [options]="dropDownCaptureMedium">
      </app-dropdown-field>
    </div>

  </div>

  <div class="d-flex align-items-center justify-content-center">
    <button
      class="primary-button big-button back-gray-400 white mx-1"
      type="button"
      (click)="cancelForm()">
      {{ 'LEAD_FORM.BTN_CANCEL' | translate }}
    </button>

    <button
      class="primary-button big-button back-light-blue-400 white mx-1"
      type="button"
      [disabled]="form.invalid"
      (click)="openConfirmationModal()">
      {{ 'LEAD_FORM.BTN_SUBMIT' | translate }}
    </button>
  </div>

  <p class="powered-by">
    {{ 'LEAD_FORM.POWERED_BY' | translate }} <span>MyMasterBook</span>
  </p>
</form>
