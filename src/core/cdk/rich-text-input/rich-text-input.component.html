<ng-container *ngIf="form" [formGroup]="form">
  <ngx-editor-menu [editor]="editor" [toolbar]="toolbar"></ngx-editor-menu>
  <ngx-editor
    [editor]="editor"
    [placeholder]="'Enter text here...'"
    formControlName="value"></ngx-editor>
  <span class="subtext-2 error-color" *ngIf="errors.length > 0">
    {{ errorMessage }}
  </span>
</ng-container>
